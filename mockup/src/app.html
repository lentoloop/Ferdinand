<!DOCTYPE html>
<html lang="zh-TW" data-theme="light" data-sveltekit-preload-data="hover">
    <head>
        <meta charset="utf-8" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/app-icon.png" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Ferdinand" />
        <!-- Match the sketch-skin --bg tokens from src/styles/tokens.css so the
             mobile browser chrome (iOS Safari / Android Chrome URL bar) blends
             with the page background instead of fighting it. -->
        <meta name="theme-color" content="#EDE8DD" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#20231F" media="(prefers-color-scheme: dark)" />
        <meta name="format-detection" content="telephone=no" />
        <title>Ferdinand</title>
        <script>
            // Apply theme before first paint to avoid flash
            (function () {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const fromUrl = params.get("theme");
                    let stored = localStorage.getItem("theme");
                    if (stored !== "light" && stored !== "dark" && stored !== "auto") stored = "auto";
                    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                    const choice = fromUrl ?? stored;
                    const theme = choice === "auto" ? (prefersDark ? "dark" : "light") : choice;
                    document.documentElement.dataset.theme = theme;
                } catch (_) {}
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="app">%sveltekit.body%</div>
    </body>
</html>
